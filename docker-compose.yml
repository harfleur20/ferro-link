# Lance le site, l'API et la base : docker compose up --build
# Puis ouvrir http://localhost:8080 (voir README.md).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ferrolink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ferrolink-local}
      POSTGRES_DB: ferrolink
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferrolink -d ferrolink"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:4000"
    environment:
      DATABASE_URL: postgresql://ferrolink:${POSTGRES_PASSWORD:-ferrolink-local}@db:5432/ferrolink?schema=public
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Le site local est en HTTP : à passer à true derrière HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-}
    volumes:
      - app-data:/data

volumes:
  db-data:
  app-data:
